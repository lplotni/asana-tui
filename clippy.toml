# Settings for clippy's lints. Which lints run is set by the CI command
# (`cargo clippy --all-targets -- -D warnings`), not here.

# The library exists only for the `asn` binary, its tests and examples, so
# clippy may suggest changing public signatures too.
avoid-breaking-exported-api = false

disallowed-methods = [
    { path = "std::process::exit", reason = "it skips destructors, so the TUI wouldn't restore the terminal; return an ExitCode from main" },
    { path = "std::thread::sleep", reason = "it blocks a tokio worker; use tokio::time::sleep, or allow it on a thread of its own" },
]
