[package]
name = "asn"
version = "0.4.1"
edition = "2024"
description = "Your Asana Inbox in the terminal, with vim keys and a scriptable CLI"
license = "MIT"
repository = "https://github.com/lplotni/asana-tui"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
ratatui-textarea = "0.9.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
terminal-colorsaurus = "1.0.3"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "1.2.1"
unicode-width = "0.2"

[lints.clippy]
# The pedantic lints with a size or count threshold (set in clippy.toml, the
# defaults otherwise). CI's `-D warnings` makes them errors.
fn_params_excessive_bools = "warn"
index_refutable_slice = "warn"
large_futures = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
many_single_char_names = "warn"
struct_excessive_bools = "warn"
struct_field_names = "warn"
too_many_lines = "warn"
trivially_copy_pass_by_ref = "warn"
unnecessary_box_returns = "warn"

[dev-dependencies]
insta = "1.49.0"
wiremock = "0.6.5"

# The latency probe (spec F28) is a developer tool; its checks are unit-tested
# with `cargo test`.
[[example]]
name = "latency"
test = true
