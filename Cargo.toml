[package]
name = "asn"
version = "0.1.0"
edition = "2024"
description = "Your Asana Inbox in the terminal, with vim keys and a scriptable CLI"
license = "MIT"
repository = "https://github.com/lplotni/asana-tui"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
ratatui-textarea = "0.9.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
terminal-colorsaurus = "1.0.3"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "1.2.1"
unicode-width = "0.2"

[dev-dependencies]
insta = "1.49.0"
wiremock = "0.6.5"
